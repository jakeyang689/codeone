<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" width="1120" height="320" role="img" aria-label="codeone pipeline: natural language to SSA, then c1 either lowers SSA directly to LLVM IR or goes through the HIR and MLIR first; LLVM emits machine code">
  <title>codeone pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B96FF"/>
    </marker>
    <style>
      .box-accent { fill: #EEF0FF; stroke: #8B96FF; stroke-width: 1.5; }
      .label      { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #1F2430; }
      .edge       { stroke: #8B96FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; marker-end: url(#arrow); }
      .edge-label { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #5B63D3; letter-spacing: 0.4px; }
      .box-sub    { fill: #F7F8FF; stroke: #8B96FF; stroke-width: 1.3; }
      .sub-title  { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1F2430; }
      .sub-note   { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #5B63D3; }
      .note       { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 500; fill: #5B63D3; }
    </style>
  </defs>

  <rect class="box-accent" x="20" y="44" width="170" height="68" rx="14"/>
  <rect class="box-accent" x="270" y="44" width="170" height="68" rx="14"/>
  <rect class="box-accent" x="680" y="44" width="170" height="68" rx="14"/>
  <rect class="box-accent" x="930" y="44" width="170" height="68" rx="14"/>

  <text class="label" x="105" y="84" text-anchor="middle">Natural language</text>
  <text class="label" x="355" y="84" text-anchor="middle">SSA (.bx)</text>
  <text class="label" x="765" y="84" text-anchor="middle">LLVM IR</text>
  <text class="label" x="1015" y="84" text-anchor="middle">Machine code</text>

  <path class="edge" d="M194 78 H254"/>
  <path class="edge" d="M854 78 H914"/>

  <text class="edge-label" x="224" y="68" text-anchor="middle">LLM</text>
  <text class="edge-label" x="884" y="68" text-anchor="middle">LLVM</text>

  <text class="edge-label" x="560" y="30" text-anchor="middle">c1</text>

  <path class="edge" d="M444 78 H664"/>
  <text class="edge-label" x="554" y="68" text-anchor="middle">direct · default</text>

  <path class="edge" d="M355 112 V200 H384"/>
  <text class="edge-label" x="368" y="154">build</text>

  <rect class="box-sub" x="400" y="176" width="90" height="48" rx="10"/>
  <text class="sub-title" x="445" y="198" text-anchor="middle">HIR</text>
  <text class="sub-note" x="445" y="215" text-anchor="middle">c1 dialect</text>

  <path class="edge" d="M490 200 H574"/>
  <text class="edge-label" x="540" y="192" text-anchor="middle">lowering</text>

  <rect class="box-sub" x="590" y="176" width="90" height="48" rx="10"/>
  <text class="sub-title" x="635" y="198" text-anchor="middle">MLIR</text>
  <text class="sub-note" x="635" y="215" text-anchor="middle">LLVM dialect</text>

  <path class="edge" d="M680 200 H765 V128"/>
  <text class="edge-label" x="722" y="192" text-anchor="middle">translate</text>

  <text class="note" x="560" y="286" text-anchor="middle">tensor  ·  both backends emit linalg kernels in-process and link them into the module</text>
</svg>
