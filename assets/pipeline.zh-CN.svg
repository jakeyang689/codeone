<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="960" height="150" role="img" aria-label="codeone 编译流水线：自然语言变为 SSA，经 c1 降级为 LLVM IR，再由 LLVM 生成机器码">
  <title>codeone 编译流水线</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B96FF"/>
    </marker>
    <style>
      .box-accent { fill: #EEF0FF; stroke: #8B96FF; stroke-width: 1.5; }
      .label      { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #1F2430; }
      .edge       { stroke: #8B96FF; stroke-width: 2; stroke-linecap: round; fill: none; marker-end: url(#arrow); }
      .edge-label { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #5B63D3; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect class="box-accent" x="20" y="44" width="170" height="68" rx="14"/>
  <rect class="box-accent" x="270" y="44" width="170" height="68" rx="14"/>
  <rect class="box-accent" x="520" y="44" width="170" height="68" rx="14"/>
  <rect class="box-accent" x="770" y="44" width="170" height="68" rx="14"/>

  <text class="label" x="105" y="84" text-anchor="middle">自然语言</text>
  <text class="label" x="355" y="84" text-anchor="middle">SSA（.bx）</text>
  <text class="label" x="605" y="84" text-anchor="middle">LLVM IR</text>
  <text class="label" x="855" y="84" text-anchor="middle">机器码</text>

  <path class="edge" d="M194 78 H254"/>
  <path class="edge" d="M444 78 H504"/>
  <path class="edge" d="M694 78 H754"/>

  <text class="edge-label" x="224" y="68" text-anchor="middle">LLM</text>
  <text class="edge-label" x="474" y="68" text-anchor="middle">c1</text>
  <text class="edge-label" x="724" y="68" text-anchor="middle">LLVM</text>
</svg>
