# Third-party sources, fetched by tools/setup-thirdparty.sh.
#
# Format: name|version|url|sha256|build
#   build may be empty for header-only or prebuilt packages; it runs with the
#   working directory set to the extracted source tree.
#
# Archives (name-version.tar.gz) and extracted trees (name/) live in this
# directory and are gitignored. Bump version and sha256 together.

raylib|5.5|https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz|aea98ecf5bc5c5e0b789a76de0083a21a70457050ea4cc2aec7566935f5e258e|cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DBUILD_SHARED_LIBS=OFF && cmake --build build -j${JOBS:-4}
